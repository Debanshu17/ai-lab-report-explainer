services:
  # ----------------------------------------------------------------------------
  # FastAPI Backend Service (REST API & Health Endpoints)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-report-api
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_OFFLINE=1
      - EXTRACTION_MODE=rules_plus_verified_llm
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # Streamlit Interactive Web Application (Frontend UI)
  # ----------------------------------------------------------------------------
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab-report-ui
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HUB_OFFLINE=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
